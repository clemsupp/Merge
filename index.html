.board {

    gap: 7px;

    position: relative;

    display: flex;

    background:
        radial-gradient(

.slime {

    display: flex;
    align-items: center;

/* =========================

<body>

<div class="game">

    <div class="header">
        <h1 class="title">Slime Merge</h1>

        <div class="subtitle">
            Fusionne tes slimes pour monter de niveau
        </div>
    </div>

    <div class="money-box">
        <div class="money-label">Pièces</div>
        <div class="money" id="money">100</div>
    </div>

    <div class="board" id="board">

        <div class="slot empty" data-index="0"></div>
        <div class="slot empty" data-index="1"></div>
        <div class="slot empty" data-index="2"></div>

        <div class="slot empty" data-index="3"></div>
        <div class="slot empty" data-index="4"></div>
        <div class="slot empty" data-index="5"></div>

        <div class="slot empty" data-index="6"></div>
        <div class="slot empty" data-index="7"></div>
        <div class="slot empty" data-index="8"></div>

    </div>

    <div class="message" id="message"></div>

    <div class="controls">

        <button
            class="buy"
            id="buyButton"
            type="button"
        >
            Acheter · 10 🪙
        </button>

    </div>

    <div class="save-panel">

        <div class="save-title">
            Sauvegarde
        </div>

        <textarea
            class="save-area"
            id="saveArea"
            placeholder="Code de sauvegarde..."
            spellcheck="false"
        ></textarea>

        <div class="save-buttons">

            <button
                id="exportButton"
                type="button"
            >
                Exporter
            </button>

            <button
                id="importButton"
                type="button"
            >
                Importer
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const MAX_LEVEL = 10;
const BUY_PRICE = 10;

const LEVEL_NAMES = [
    "Petit slime",
    "Slime bleu",
    "Slime magique",
    "Slime doré",
    "Slime rose",
    "Slime royal",
    "Slime solaire",
    "Slime céleste",
    "Slime légendaire",
    "Slime ultime"
];

const LEVEL_ICONS = [
    "🫧",
    "💧",
    "🔮",
    "✨",
    "💗",
    "👑",
    "☀️",
    "🌙",
    "💎",
    "🌟"
];


/* =====================================================
   ÉTAT
===================================================== */

let money = 100;

let slots = [
    null, null, null,
    null, null, null,
    null, null, null
];


/* =====================================================
   ÉLÉMENTS
===================================================== */

const board =
    document.getElementById("board");

const moneyElement =
    document.getElementById("money");

const buyButton =
    document.getElementById("buyButton");

const messageElement =
    document.getElementById("message");

const saveArea =
    document.getElementById("saveArea");


/* =====================================================
   DRAG TACTILE
===================================================== */

let drag = {

    active: false,

    index: null,

    pointerId: null,

    offsetX: 0,
    offsetY: 0,

    clone: null,

    currentTarget: null
};


/* =====================================================
   AFFICHAGE ARGENT
===================================================== */

function updateMoney() {

    moneyElement.textContent =
        money.toLocaleString("fr-FR");

    const full =
        slots.every(slot => slot !== null);

    buyButton.disabled =
        money < BUY_PRICE || full;
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function showMessage(text) {

    messageElement.textContent = text;

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {

        messageElement.textContent = "";

    }, 1800);
}


/* =====================================================
   CRÉER UN SLIME
===================================================== */

function createSlime(level, index) {

    const slime =
        document.createElement("div");

    slime.className =
        `slime level-${level}`;

    slime.dataset.index = index;

    slime.innerHTML = `

        <div class="slime-content">

            <div class="slime-icon">
                ${LEVEL_ICONS[level - 1]}
            </div>

            <div class="level">
                Niveau ${level}
            </div>

            <div class="level-name">
                ${LEVEL_NAMES[level - 1]}
            </div>

        </div>
    `;

    /*
        IMPORTANT :
        pointer-events est géré sur le slime
        pour permettre le tactile.
    */

    slime.addEventListener(
        "pointerdown",
        startDrag
    );

    return slime;
}


/* =====================================================
   AFFICHER LE PLATEAU
===================================================== */

function renderBoard(animationIndex = -1) {

    const slotElements =
        board.querySelectorAll(".slot");

    slotElements.forEach(
        (slotElement, index) => {

            slotElement.innerHTML = "";

            const data = slots[index];

            if (!data) {

                slotElement.classList.add("empty");

                return;
            }

            slotElement.classList.remove("empty");

            const slime =
                createSlime(
                    data.level,
                    index
                );

            if (animationIndex === index) {

                slime.classList.add("appear");
            }

            slotElement.appendChild(slime);
        }
    );

    updateMoney();
}


/* =====================================================
   POSITION DU DOIGT
===================================================== */

function moveClone(x, y) {

    if (!drag.clone) return;

    drag.clone.style.left = x + "px";
    drag.clone.style.top = y + "px";
}


/* =====================================================
   TROUVER LA CASE SOUS LE DOIGT
===================================================== */

function getSlotAtPoint(x, y) {

    const elements =
        document.elementsFromPoint(x, y);

    for (const element of elements) {

        const slot =
            element.closest(".slot");

        if (slot && board.contains(slot)) {

            return Number(
                slot.dataset.index
            );
        }
    }

    return null;
}


/* =====================================================
   COMMENCER À DÉPLACER
===================================================== */

function startDrag(event) {

    /*
        Uniquement tactile / stylet.
    */

    if (
        event.pointerType !== "touch" &&
        event.pointerType !== "pen"
    ) {
        return;
    }

    const slime =
        event.currentTarget;

    const index =
        Number(slime.dataset.index);

    if (!slots[index]) return;

    event.preventDefault();

    /*
        Évite que le navigateur interprète
        le geste comme un scroll / zoom.
    */

    slime.setPointerCapture(
        event.pointerId
    );

    const rect =
        slime.getBoundingClientRect();

    drag.active = true;
    drag.index = index;
    drag.pointerId = event.pointerId;

    drag.offsetX =
        event.clientX -
        (rect.left + rect.width / 2);

    drag.offsetY =
        event.clientY -
        (rect.top + rect.height / 2);

    /*
        On cache légèrement le slime original.
    */

    slime.style.opacity = ".22";

    slime.classList.add("dragging");

    /*
        Création du clone qui suit le doigt.
    */

    const clone =
        document.createElement("div");

    clone.className =
        "drag-clone";

    const cloneSlime =
        createSlime(
            slots[index].level,
            index
        );

    cloneSlime.style.pointerEvents =
        "none";

    clone.appendChild(cloneSlime);

    document.body.appendChild(clone);

    drag.clone = clone;

    moveClone(
        event.clientX,
        event.clientY
    );

    clearTargets();
}


/* =====================================================
   DÉPLACEMENT DU DOIGT
===================================================== */

document.addEventListener(
    "pointermove",
    event => {

        if (!drag.active) return;

        if (
            event.pointerId !==
            drag.pointerId
        ) {
            return;
        }

        event.preventDefault();

        moveClone(
            event.clientX,
            event.clientY
        );

        updateTarget(
            event.clientX,
            event.clientY
        );
    },
    { passive: false }
);


/* =====================================================
   CIBLE
===================================================== */

function updateTarget(x, y) {

    clearTargets();

    const target =
        getSlotAtPoint(x, y);

    drag.currentTarget =
        target;

    if (
        target === null ||
        target === drag.index
    ) {
        return;
    }

    const slot =
        board.querySelector(
            `.slot[data-index="${target}"]`
        );

    if (!slot) return;

    /*
        Même niveau :
        cible de fusion.
    */

    if (
        slots[target] &&
        slots[target].level ===
        slots[drag.index].level &&
        slots[target].level < MAX_LEVEL
    ) {

        slot.classList.add(
            "target-merge"
        );

    } else {

        slot.classList.add(
            "target"
        );
    }
}


/* =====================================================
   EFFACER LES CIBLES
===================================================== */

function clearTargets() {

    board
        .querySelectorAll(".slot")
        .forEach(slot => {

            slot.classList.remove(
                "target",
                "target-merge"
            );
        });
}


/* =====================================================
   RELÂCHER LE DOIGT
===================================================== */

document.addEventListener(
    "pointerup",
    finishDrag
);

document.addEventListener(
    "pointercancel",
    finishDrag
);


function finishDrag(event) {

    if (!drag.active) return;

    if (
        event.pointerId !==
        drag.pointerId
    ) {
        return;
    }

    event.preventDefault();

    const from =
        drag.index;

    const to =
        getSlotAtPoint(
            event.clientX,
            event.clientY
        );

    const draggedSlime =
        board.querySelector(
            `.slot[data-index="${from}"] .slime`
        );

    if (draggedSlime) {

        draggedSlime.style.opacity = "1";
    }

    /*
        Supprime le clone.
    */

    if (drag.clone) {

        drag.clone.remove();

        drag.clone = null;
    }

    clearTargets();

    drag.active = false;
    drag.index = null;
    drag.pointerId = null;
    drag.currentTarget = null;

    /*
        Aucun déplacement valide.
    */

    if (
        to === null ||
        to === from
    ) {

        renderBoard();

        return;
    }

    moveOrMerge(
        from,
        to,
        event.clientX,
        event.clientY
    );
}


/* =====================================================
   DÉPLACEMENT / FUSION
===================================================== */

function moveOrMerge(
    from,
    to,
    x,
    y
) {

    const source =
        slots[from];

    const target =
        slots[to];

    if (!source) return;

    /*
        CASE VIDE
    */

    if (!target) {

        slots[to] = source;
        slots[from] = null;

        renderBoard(to);

        return;
    }

    /*
        NIVEAUX DIFFÉRENTS
        => ÉCHANGE
    */

    if (
        source.level !==
        target.level
    ) {

        slots[from] = target;
        slots[to] = source;

        renderBoard(to);

        return;
    }

    /*
        NIVEAU MAX
    */

    if (
        source.level >=
        MAX_LEVEL
    ) {

        showMessage(
            "Niveau maximum atteint !"
        );

        renderBoard();

        return;
    }

    /*
        FUSION
    */

    const newLevel =
        source.level + 1;

    slots[to] = {
        level: newLevel
    };

    slots[from] = null;

    /*
        Récompense.
    */

    money +=
        newLevel * 3;

    renderBoard(to);

    /*
        Animation du slime créé.
    */

    requestAnimationFrame(() => {

        const newSlime =
            board.querySelector(
                `.slot[data-index="${to}"] .slime`
            );

        if (newSlime) {

            newSlime.classList.remove(
                "appear"
            );

            void newSlime.offsetWidth;

            newSlime.classList.add(
                "merge-pop"
            );
        }
    });

    /*
        Flash de fusion
        directement sous le doigt.
    */

    createMergeFlash(
        x,
        y
    );

    showMessage(
        `Fusion ! Niveau ${newLevel} ✨`
    );
}


/* =====================================================
   FLASH DE FUSION
===================================================== */

function createMergeFlash(x, y) {

    const flash =
        document.createElement("div");

    flash.className =
        "merge-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    document.body.appendChild(flash);

    setTimeout(() => {

        flash.remove();

    }, 600);
}


/* =====================================================
   ACHAT
===================================================== */

buyButton.addEventListener(
    "click",
    () => {

        if (money < BUY_PRICE) {

            showMessage(
                "Pas assez de pièces."
            );

            return;
        }

        const index =
            slots.findIndex(
                slot => slot === null
            );

        if (index === -1) {

            showMessage(
                "Les 9 cases sont pleines."
            );

            return;
        }

        money -= BUY_PRICE;

        slots[index] = {
            level: 1
        };

        renderBoard(index);

        showMessage(
            "Nouveau slime !"
        );
    }
);


/* =====================================================
   SAUVEGARDE
===================================================== */

function createSave() {

    const data = {

        version: 1,

        money: money,

        slots: slots,

        savedAt: Date.now()
    };

    const json =
        JSON.stringify(data);

    return btoa(
        encodeURIComponent(json)
    );
}


/* =====================================================
   CHARGEMENT
===================================================== */

function loadSave(code) {

    try {

        const json =
            decodeURIComponent(
                atob(code.trim())
            );

        const data =
            JSON.parse(json);

        if (
            !data ||
            !Array.isArray(data.slots) ||
            data.slots.length !== 9 ||
            typeof data.money !== "number"
        ) {

            throw new Error();
        }

        for (
            const slot of data.slots
        ) {

            if (slot !== null) {

                if (
                    typeof slot.level !== "number" ||
                    slot.level < 1 ||
                    slot.level > MAX_LEVEL
                ) {

                    throw new Error();
                }
            }
        }

        money =
            Math.max(
                0,
                Math.floor(data.money)
            );

        slots =
            data.slots;

        renderBoard();

        return true;

    } catch {

        return false;
    }
}

document

document

                );

            } else {

                );
            }
        }
    );


/* =====================================================
   SAUVEGARDE AUTOMATIQUE
===================================================== */

setInterval(

        try {

            localStorage.setItem(
                "slimeMergeAutoSave",
                createSave()
            );

        } catch {}
    },
    3000

/* =====================================================
   CHARGEMENT AUTO
===================================================== */

function loadAutomaticSave() {

    try {

        const saved =
            localStorage.getItem(
                "slimeMergeAutoSave"
            );

        if (
            saved &&
            loadSave(saved)
        ) {

            showMessage(
                "Sauvegarde automatique chargée."
            );

            return;
        }

    } catch {}

    renderBoard();
}
