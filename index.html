<body>

<div class="game">

    <div class="header">

        <h1 class="title">
            Slime Merge
        </h1>

        <div class="subtitle">
            Fusionne deux slimes identiques
        </div>

    </div>

    <div
        class="board"
        id="board"
    >

        <div
            class="slot empty"
            data-index="0"
        ></div>

        <div
            class="slot empty"
            data-index="1"
        ></div>

        <div
            class="slot empty"
            data-index="2"
        ></div>

        <div
            class="slot empty"
            data-index="3"
        ></div>

        <div
            class="slot empty"
            data-index="4"
        ></div>

        <div
            class="slot empty"
            data-index="5"
        ></div>

        <div
            class="slot empty"
            data-index="6"
        ></div>

        <div
            class="slot empty"
            data-index="7"
        ></div>

        <div
            class="slot empty"
            data-index="8"
        ></div>

    </div>

    <div
        class="message"
        id="message"
    ></div>

    <div class="controls">

        <button
            class="buy"
            id="buyButton"
            type="button"
        >
            ＋ Ajouter un slime
        </button>

    </div>

    <div class="save-panel">

        <div class="save-title">
            Sauvegarde
        </div>

        <textarea
            id="saveArea"
            class="save-area"
            placeholder="Ton code de sauvegarde..."
            spellcheck="false"
        ></textarea>

        <div class="save-buttons">

            <button
                id="exportButton"
                type="button"
            >
                Copier la sauvegarde
            </button>

            <button
                id="importButton"
                type="button"
            >
                Charger
            </button>

        </div>

    </div>

</div>

<script>

const MAX_LEVEL = 10;

const LEVEL_NAMES = [

    "Petit slime",
    "Slime bleu",
    "Slime magique",
    "Slime doré",
    "Slime rose",
    "Slime royal",
    "Slime solaire",
    "Slime céleste",
    "Slime légendaire",
    "Slime ultime"

];

const LEVEL_ICONS = [

    "🫧",
    "💧",
    "🔮",
    "✨",
    "💗",
    "👑",
    "☀️",
    "🌙",
    "💎",
    "🌟"

];

let slots = [

    null, null, null,
    null, null, null,
    null, null, null

];

const board =
    document.getElementById("board");

const buyButton =
    document.getElementById("buyButton");

const messageElement =
    document.getElementById("message");

const saveArea =
    document.getElementById("saveArea");

let drag = {

    active: false,

    index: null,

    pointerId: null,

    clone: null

};

let messageTimer;

function showMessage(text) {

    messageElement.textContent =
        text;

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(() => {

            messageElement.textContent =
                "";

        }, 1800);
}

function createSlime(
    level,
    index
) {

    const slime =
        document.createElement("div");

    slime.className =
        `slime level-${level}`;

    slime.dataset.index =
        index;

    slime.innerHTML = `

        <div class="slime-content">

            <div class="slime-icon">
                ${LEVEL_ICONS[level - 1]}
            </div>

            <div class="level">
                Niveau ${level}
            </div>

            <div class="level-name">
                ${LEVEL_NAMES[level - 1]}
            </div>

        </div>

    `;

    slime.addEventListener(
        "pointerdown",
        startDrag
    );

    return slime;
}

function renderBoard(
    animationIndex = -1
) {

    const slotsElements =
        board.querySelectorAll(".slot");

    slotsElements.forEach(
        (slotElement, index) => {

            slotElement.innerHTML = "";

            const data =
                slots[index];

            if (!data) {

                slotElement.classList.add(
                    "empty"
                );

                return;
            }

            slotElement.classList.remove(
                "empty"
            );

            const slime =
                createSlime(
                    data.level,
                    index
                );

            if (
                animationIndex === index
            ) {

                slime.classList.add(
                    "appear"
                );
            }

            slotElement.appendChild(
                slime
            );

        }
    );

    updateBuyButton();
}

function updateBuyButton() {

    buyButton.disabled =
        slots.every(
            slot => slot !== null
        );
}


/* =========================================================
   BOUTON RAPIDE — MODIFICATION
========================================================= */

buyButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        const index =
            slots.findIndex(
                slot => slot === null
            );

        if (index === -1) {

            showMessage(
                "Les 9 cases sont pleines."
            );

            return;
        }

        slots[index] = {

            level: 1

        };

        renderBoard(index);

        showMessage(
            "Nouveau slime !"
        );

    },
    {
        passive: false
    }
);

buyButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

    }
);

function getSlotAtPoint(
    x,
    y
) {

    const elements =
        document.elementsFromPoint(
            x,
            y
        );

    for (
        const element
        of elements
    ) {

        const slot =
            element.closest(".slot");

        if (
            slot &&
            board.contains(slot)
        ) {

            return Number(
                slot.dataset.index
            );

        }

    }

    return null;
}

function createDragClone(
    level
) {

    const clone =
        document.createElement("div");

    clone.className =
        "drag-clone";

    const slime =
        createSlime(
            level,
            -1
        );

    slime.style.pointerEvents =
        "none";

    clone.appendChild(
        slime
    );

    document.body.appendChild(
        clone
    );

    return clone;
}

function moveClone(
    x,
    y
) {

    if (!drag.clone)
        return;

    drag.clone.style.left =
        x + "px";

    drag.clone.style.top =
        y + "px";
}

function clearTargets() {

    board
        .querySelectorAll(".slot")
        .forEach(slot => {

            slot.classList.remove(
                "target",
                "target-merge"
            );

        });
}

function updateTarget(
    x,
    y
) {

    clearTargets();

    const target =
        getSlotAtPoint(
            x,
            y
        );

    if (
        target === null ||
        target === drag.index
    ) {

        return;
    }

    const targetSlot =
        board.querySelector(
            `.slot[data-index="${target}"]`
        );

    if (!targetSlot)
        return;

    const source =
        slots[drag.index];

    const destination =
        slots[target];

    if (
        source &&
        destination &&
        source.level ===
        destination.level &&
        source.level < MAX_LEVEL
    ) {

        targetSlot.classList.add(
            "target-merge"
        );

    } else {

        targetSlot.classList.add(
            "target"
        );
    }
}

function startDrag(event) {

    if (
        event.pointerType !== "touch" &&
        event.pointerType !== "pen"
    ) {

        return;
    }

    const slime =
        event.currentTarget;

    const index =
        Number(slime.dataset.index);

    if (
        !slots[index]
    ) {

        return;
    }

    event.preventDefault();

    try {

        slime.setPointerCapture(
            event.pointerId
        );

    } catch {}

    drag.active = true;

    drag.index =
        index;

    drag.pointerId =
        event.pointerId;

    slime.style.opacity =
        ".18";

    slime.classList.add(
        "dragging"
    );

    drag.clone =
        createDragClone(
            slots[index].level
        );

    moveClone(
        event.clientX,
        event.clientY
    );

    clearTargets();
}

document.addEventListener(
    "pointermove",
    event => {

        if (
            !drag.active ||
            event.pointerId !==
            drag.pointerId
        ) {

            return;
        }

        event.preventDefault();

        moveClone(
            event.clientX,
            event.clientY
        );

        updateTarget(
            event.clientX,
            event.clientY
        );

    },
    {
        passive: false
    }
);

document.addEventListener(
    "pointerup",
    finishDrag
);

document.addEventListener(
    "pointercancel",
    finishDrag
);

function finishDrag(event) {

    if (
        !drag.active ||
        event.pointerId !==
        drag.pointerId
    ) {

        return;
    }

    event.preventDefault();

    const from =
        drag.index;

    const to =
        getSlotAtPoint(
            event.clientX,
            event.clientY
        );

    if (drag.clone) {

        drag.clone.remove();

        drag.clone =
            null;
    }

    const original =
        board.querySelector(
            `.slot[data-index="${from}"] .slime`
        );

    if (original) {

        original.style.opacity =
            "1";

        original.classList.remove(
            "dragging"
        );
    }

    clearTargets();

    drag.active =
        false;

    drag.index =
        null;

    drag.pointerId =
        null;

    if (
        to === null ||
        to === from
    ) {

        renderBoard();

        return;
    }

    moveOrMerge(
        from,
        to,
        event.clientX,
        event.clientY
    );

}

function moveOrMerge(
    from,
    to,
    x,
    y
) {

    const source =
        slots[from];

    const target =
        slots[to];

    if (!source)
        return;

    if (!target) {

        slots[to] =
            source;

        slots[from] =
            null;

        renderBoard(to);

        return;
    }

    if (
        source.level !==
        target.level
    ) {

        slots[from] =
            target;

        slots[to] =
            source;

        renderBoard(to);

        return;
    }

    if (
        source.level >=
        MAX_LEVEL
    ) {

        showMessage(
            "Niveau maximum !"
        );

        renderBoard();

        return;
    }

    const newLevel =
        source.level + 1;

    slots[to] = {

        level: newLevel

    };

    slots[from] =
        null;

    renderBoard(to);

    setTimeout(
        () => {

            const newSlime =
                board.querySelector(
                    `.slot[data-index="${to}"] .slime`
                );

            if (newSlime) {

                newSlime.classList.add(
                    "merge-pop"
                );

            }

        },
        10
    );

    createMergeFlash(
        x,
        y
    );

    showMessage(
        `Niveau ${newLevel} !`
    );

}

function createMergeFlash(
    x,
    y
) {

    const flash =
        document.createElement(
            "div"
        );

    flash.className =
        "merge-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    document.body.appendChild(
        flash
    );

    setTimeout(
        () => {

            flash.remove();

        },
        600
    );
}

function createSave() {

    const data = {

        version: 1,

        slots: slots,

        savedAt: Date.now()

    };

    const json =
        JSON.stringify(data);

    return btoa(
        encodeURIComponent(json)
    );
}

function loadSave(
    code
) {

    try {

        const json =
            decodeURIComponent(
                atob(code.trim())
            );

        const data =
            JSON.parse(json);

        if (
            !data ||
            !Array.isArray(data.slots) ||
            data.slots.length !== 9
        ) {

            throw new Error();

        }

        for (
            const slot
            of data.slots
        ) {

            if (
                slot !== null
            ) {

                if (
                    typeof slot.level !==
                    "number" ||
                    slot.level < 1 ||
                    slot.level >
                    MAX_LEVEL
                ) {

                    throw new Error();

                }

            }

        }

        slots =
            data.slots;

        renderBoard();

        return true;

    } catch {

        return false;

    }
}

document
    .getElementById("exportButton")
    .addEventListener(
        "click",
        async () => {

            const code =
                createSave();

            saveArea.value =
                code;

            try {

                await navigator
                    .clipboard
                    .writeText(code);

                showMessage(
                    "Sauvegarde copiée !"
                );

            } catch {

                saveArea.focus();

                saveArea.select();

                showMessage(
                    "Code prêt à copier."
                );

            }

        }
    );

document
    .getElementById("importButton")
    .addEventListener(
        "click",
        () => {

            const code =
                saveArea.value.trim();

            if (!code) {

                showMessage(
                    "Colle une sauvegarde."
                );

                return;
            }

            if (
                loadSave(code)
            ) {

                showMessage(
                    "Sauvegarde chargée !"
                );

            } else {

                showMessage(
                    "Sauvegarde invalide."
                );

            }

        }
    );

setInterval(
    () => {

        try {

            localStorage.setItem(
                "slimeMergeAutoSave",
                createSave()
            );

        } catch {}

    },
    3000
);

function loadAutomaticSave() {

    try {

        const saved =
            localStorage.getItem(
                "slimeMergeAutoSave"
            );

        if (
            saved &&
            loadSave(saved)
        ) {

            return;
        }

    } catch {}

    renderBoard();
}

document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();

        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }

        lastTouchEnd =
            now;

    },
    {
        passive: false
    }
);

loadAutomaticSave();

</script>
