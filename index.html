<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    minimum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Slime Merge</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    touch-action: none;

    background:
        radial-gradient(
            circle at 50% 30%,
            #252d27 0%,
            #171b18 45%,
            #0d100e 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   PANNEAU SAUVEGARDE
   ========================================================= */

.save-panel {

    position: fixed;

    left: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 145px;

    padding: 13px 11px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(31,42,35,.97),
            rgba(13,18,15,.97)
        );

    border:
        1px solid
        rgba(190,255,190,.12);

    box-shadow:
        0 15px 35px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.06);

    z-index: 10000;

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.save-title {

    text-align: center;

    font-size: 13px;

    font-weight: 800;

    color: #d9e8dc;
}


.save-area {

    width: 100%;

    height: 74px;

    resize: none;

    border: none;
    outline: none;

    border-radius: 10px;

    padding: 8px;

    background:
        rgba(0,0,0,.28);

    color: #dcefe0;

    font-size: 10px;

    line-height: 1.3;

    font-family: monospace;

    touch-action: auto;
}


.save-area::placeholder {

    color:
        rgba(220,239,224,.4);
}


.save-buttons {

    display: flex;

    flex-direction: column;

    gap: 6px;

    margin-top: 1px;
}


.save-buttons button {

    width: 100%;

    min-height: 34px;

    padding: 5px 6px;

    border: none;

    border-radius: 9px;

    background:
        linear-gradient(
            180deg,
            #3d5544,
            #29392e
        );

    color: white;

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;
}


.save-buttons button:active {

    transform: scale(.96);
}


/* =========================================================
   JEU
   ========================================================= */

.game {

    width:
        min(94vw, 540px);

    height: 100dvh;

    margin: auto;

    display: flex;

    flex-direction: column;

    justify-content: center;

    overflow: hidden;

    padding:
        max(8px, env(safe-area-inset-top))
        0
        max(8px, env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    text-align: center;

    margin-bottom: 12px;
}


.title {

    margin: 0;

    font-size: 32px;

    font-weight: 900;

    letter-spacing: -.8px;
}


.subtitle {

    margin-top: 5px;

    color:
        rgba(255,255,255,.55);

    font-size: 13px;
}


/* =========================================================
   ZONE DU PLATEAU + STOCKAGE
   ========================================================= */

.game-area {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    width: 100%;
}


/* =========================================================
   PLATEAU
   ========================================================= */

.board {

    width: min(72vw, 400px);

    aspect-ratio: 1 / 1;

    margin: 0;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    gap: 10px;

    padding: 10px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            #252d27,
            #151a17
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    box-shadow:
        0 20px 45px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.04);
}


.slot {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 0;
    min-height: 0;

    border-radius: 18px;

    background:
        rgba(0,0,0,.16);

    border:
        1px solid
        rgba(255,255,255,.045);

    overflow: visible;

    touch-action: none;
}


.slot.empty {

    background:
        rgba(0,0,0,.13);
}


/* =========================================================
   STOCKAGE
   ========================================================= */

.storage {

    width: 92px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;
}


.storage-title {

    font-size: 11px;

    font-weight: 900;

    color:
        rgba(255,255,255,.65);

    text-align: center;
}


.storage-slot {

    width: 82px;
    height: 82px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(38,48,41,.95),
            rgba(18,23,20,.95)
        );

    border:
        1px solid
        rgba(190,255,190,.10);

    box-shadow:
        inset 0 1px
        rgba(255,255,255,.04),
        0 7px 15px
        rgba(0,0,0,.25);

    touch-action: none;
}


.storage-slot.empty::after {

    content: "+";

    position: absolute;

    font-size: 22px;

    font-weight: 300;

    color:
        rgba(255,255,255,.14);
}


/* =========================================================
   SLIMES
   ========================================================= */

.slime {

    width: 78%;
    height: 78%;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius:
        48%
        48%
        42%
        42%;

    cursor: grab;

    user-select: none;

    touch-action: none;

    transition:
        transform .12s ease,
        filter .12s ease;

    box-shadow:
        inset 0 7px 10px rgba(255,255,255,.15),
        inset 0 -10px 14px rgba(0,0,0,.15),
        0 8px 18px rgba(0,0,0,.3);
}


.slime::before {

    content: "";

    position: absolute;

    width: 32%;
    height: 18%;

    left: 19%;
    top: 13%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.55);

    filter: blur(1px);

    transform: rotate(-18deg);
}


.slime::after {

    content: "";

    position: absolute;

    width: 11%;
    height: 7%;

    right: 20%;
    top: 22%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.3);
}


.slime.dragging {

    transform:
        scale(1.15);

    filter:
        brightness(1.15)
        drop-shadow(
            0 12px 15px
            rgba(0,0,0,.4)
        );

    z-index: 1000;
}


/* =========================================================
   VISAGE
   ========================================================= */

.face {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18%;

    margin-top: 10%;
}


.eye {

    width: 12px;
    height: 16px;

    border-radius: 50%;

    background:
        rgba(20,25,20,.82);
}


.mouth {

    position: absolute;

    width: 20px;
    height: 10px;

    left: 50%;
    top: 18px;

    transform:
        translateX(-50%);

    border-bottom:
        3px solid
        rgba(20,25,20,.75);

    border-radius:
        0 0 50% 50%;
}


.level-icon {

    position: absolute;

    bottom: 8%;

    right: 8%;

    font-size:
        clamp(12px, 3vw, 22px);

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,.3)
        );
}


/* =========================================================
   COULEURS DES SLIMES
   ========================================================= */

.level-1 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #d8fff0,
            #6ee7b7 45%,
            #159a67 100%
        );
}


.level-2 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #d8f5ff,
            #58c7ff 45%,
            #1874c5 100%
        );
}


.level-3 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #f0ddff,
            #b46cff 45%,
            #6421b9 100%
        );
}


.level-4 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #fffbd0,
            #ffe45c 45%,
            #d89400 100%
        );
}


.level-5 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff0f7,
            #ff72b5 45%,
            #c72b78 100%
        );
}


.level-6 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff6c9,
            #ffc94d 45%,
            #a86a00 100%
        );
}


.level-7 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff9cf,
            #ffb51e 40%,
            #ff5c00 100%
        );
}


.level-8 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #eefcff,
            #7ee8ff 42%,
            #2d65ff 100%
        );
}


.level-9 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffffff,
            #a7c8ff 38%,
            #5b32d6 100%
        );
}


.level-10 {

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffffff,
            #ffe66b 30%,
            #ff9f1c 60%,
            #ef3b3b 100%
        );

    box-shadow:
        inset 0 7px 10px
        rgba(255,255,255,.25),
        inset 0 -10px 14px
        rgba(0,0,0,.18),
        0 0 25px
        rgba(255,180,40,.4);
}


/* =========================================================
   BOUTON
   ========================================================= */

.buy {

    width: 90%;

    min-height: 54px;

    margin:
        13px auto 0;

    border: none;

    border-radius: 16px;

    background:
        linear-gradient(
            180deg,
            #4fcb79,
            #279b52
        );

    color: white;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(25,130,65,.25),
        inset 0 1px
        rgba(255,255,255,.22);

    touch-action: manipulation;
}


.buy:active {

    transform:
        scale(.97);

    filter:
        brightness(.92);
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message {

    height: 24px;

    margin-top: 5px;

    text-align: center;

    font-size: 12px;

    font-weight: 700;

    color:
        rgba(255,255,255,.55);

    opacity: 0;

    transition:
        opacity .2s ease;
}


.message.show {

    opacity: 1;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

.merge-animation {

    animation:
        mergePop .35s ease;
}


@keyframes mergePop {

    0% {
        transform: scale(.65);
    }

    60% {
        transform: scale(1.18);
    }

    100% {
        transform: scale(1);
    }
}


.new-animation {

    animation:
        newPop .3s ease;
}


@keyframes newPop {

    0% {
        transform:
            scale(.5);

        opacity: .2;
    }

    100% {
        transform:
            scale(1);

        opacity: 1;
    }
}


/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media (max-height: 750px) {

    .game {

        transform:
            scale(.88);

        transform-origin:
            center center;
    }
}


</style>

</head>


<body>


<!-- =====================================================
     PANNEAU SAUVEGARDE
     ===================================================== -->

<div class="save-panel">

    <div class="save-title">
        Sauvegarde
    </div>

    <textarea
        id="saveArea"
        class="save-area"
        placeholder="Code..."
        spellcheck="false"
    ></textarea>

    <div class="save-buttons">

        <button
            id="copyButton"
            type="button"
        >
            Copier
        </button>

        <button
            id="pasteButton"
            type="button"
        >
            Coller
        </button>

        <button
            id="importButton"
            type="button"
        >
            Charger
        </button>

    </div>

</div>


<!-- =====================================================
     JEU
     ===================================================== -->

<div class="game">


    <div class="header">

        <h1 class="title">
            Slime Merge
        </h1>

        <div class="subtitle">
            Fusionne deux slimes identiques
        </div>

    </div>


    <!-- PLATEAU + STOCKAGE -->

    <div class="game-area">


        <!-- PLATEAU -->

        <div
            id="board"
            class="board"
        >

            <div
                class="slot empty"
                data-index="0"
            ></div>

            <div
                class="slot empty"
                data-index="1"
            ></div>

            <div
                class="slot empty"
                data-index="2"
            ></div>

            <div
                class="slot empty"
                data-index="3"
            ></div>

            <div
                class="slot empty"
                data-index="4"
            ></div>

            <div
                class="slot empty"
                data-index="5"
            ></div>

            <div
                class="slot empty"
                data-index="6"
            ></div>

            <div
                class="slot empty"
                data-index="7"
            ></div>

            <div
                class="slot empty"
                data-index="8"
            ></div>

        </div>


        <!-- STOCKAGE À DROITE -->

        <div class="storage">

            <div class="storage-title">
                Stockage
            </div>

            <div
                class="storage-slot empty"
                data-storage="0"
            ></div>

            <div
                class="storage-slot empty"
                data-storage="1"
            ></div>

            <div
                class="storage-slot empty"
                data-storage="2"
            ></div>

        </div>


    </div>


    <button
        id="buyButton"
        class="buy"
        type="button"
    >
        ＋ Ajouter un slime
    </button>


    <div
        id="message"
        class="message"
    ></div>


</div>


<script>


/* =========================================================
   CONSTANTES
   ========================================================= */

const MAX_LEVEL = 10;


/* =========================================================
   NOMS
   ========================================================= */

const LEVEL_NAMES = [

    "Petit slime",
    "Slime bleu",
    "Slime magique",
    "Slime doré",
    "Slime rose",
    "Slime royal",
    "Slime solaire",
    "Slime céleste",
    "Slime légendaire",
    "Slime ultime"

];


const LEVEL_ICONS = [

    "🫧",
    "💧",
    "🔮",
    "✨",
    "💗",
    "👑",
    "☀️",
    "🌙",
    "💎",
    "🌟"

];


/* =========================================================
   ÉTAT DU JEU
   ========================================================= */

let slots = [

    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null,
    null

];


/* 3 cases de stockage */

let storageSlots = [

    null,
    null,
    null

];


let draggedType = null;

let draggedIndex = null;

let pointerId = null;

let draggedElement = null;

let dragClone = null;


/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const board =
    document.getElementById("board");

const buyButton =
    document.getElementById("buyButton");

const message =
    document.getElementById("message");

const saveArea =
    document.getElementById("saveArea");


/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimer = null;


function showMessage(text) {

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1500
        );
}


/* =========================================================
   CRÉER UN SLIME
   ========================================================= */

function createSlimeElement(
    level,
    type,
    index
) {

    const slime =
        document.createElement("div");

    slime.className =
        "slime level-" + level;

    slime.dataset.level =
        level;

    slime.dataset.type =
        type;

    slime.dataset.index =
        index;


    const face =
        document.createElement("div");

    face.className =
        "face";


    const eye1 =
        document.createElement("div");

    eye1.className =
        "eye";


    const eye2 =
        document.createElement("div");

    eye2.className =
        "eye";


    const mouth =
        document.createElement("div");

    mouth.className =
        "mouth";


    face.appendChild(
        eye1
    );

    face.appendChild(
        eye2
    );

    face.appendChild(
        mouth
    );


    const icon =
        document.createElement("div");

    icon.className =
        "level-icon";

    icon.textContent =
        LEVEL_ICONS[level - 1];


    slime.appendChild(
        face
    );

    slime.appendChild(
        icon
    );


    addDragEvents(
        slime,
        type,
        index
    );


    return slime;
}


/* =========================================================
   AFFICHAGE
   ========================================================= */

function renderBoard(
    animationIndex = -1,
    animationClass = "new-animation"
) {

    const boardSlots =
        board.querySelectorAll(
            ".slot"
        );


    boardSlots.forEach(
        (slotElement, index) => {

            slotElement.innerHTML =
                "";

            slotElement.classList.add(
                "empty"
            );


            const slime =
                slots[index];


            if (!slime) {

                return;
            }


            slotElement.classList.remove(
                "empty"
            );


            const slimeElement =
                createSlimeElement(
                    slime.level,
                    "board",
                    index
                );


            if (
                index ===
                animationIndex
            ) {

                slimeElement.classList.add(
                    animationClass
                );
            }


            slotElement.appendChild(
                slimeElement
            );

        }
    );


    renderStorage();

    autosave();
}


/* =========================================================
   AFFICHAGE STOCKAGE
   ========================================================= */

function renderStorage() {

    const storageElements =
        document.querySelectorAll(
            ".storage-slot"
        );


    storageElements.forEach(
        (slotElement, index) => {

            slotElement.innerHTML =
                "";

            slotElement.classList.add(
                "empty"
            );


            const slime =
                storageSlots[index];


            if (!slime) {

                return;
            }


            slotElement.classList.remove(
                "empty"
            );


            const slimeElement =
                createSlimeElement(
                    slime.level,
                    "storage",
                    index
                );


            slotElement.appendChild(
                slimeElement
            );

        }
    );
}


/* =========================================================
   AJOUTER UN SLIME
   ========================================================= */

buyButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();


        const index =
            slots.findIndex(
                slot =>
                    slot === null
            );


        if (index === -1) {

            showMessage(
                "Les 9 cases sont pleines."
            );

            return;
        }


        slots[index] = {

            level: 1

        };


        renderBoard(
            index
        );


        showMessage(
            "Nouveau slime !"
        );

    },
    {
        passive: false
    }
);


buyButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

    }
);


/* =========================================================
   DRAG
   ========================================================= */

function addDragEvents(
    slime,
    type,
    index
) {

    slime.addEventListener(
        "pointerdown",
        event => {

            if (
                event.pointerType === "mouse" &&
                event.button !== 0
            ) {

                return;
            }


            event.preventDefault();


            draggedType =
                type;

            draggedIndex =
                index;

            pointerId =
                event.pointerId;

            draggedElement =
                slime;


            try {

                slime.setPointerCapture(
                    pointerId
                );

            } catch {}


            slime.classList.add(
                "dragging"
            );


            createDragClone(
                slime,
                event.clientX,
                event.clientY
            );

        },
        {
            passive: false
        }
    );


    slime.addEventListener(
        "pointermove",
        event => {

            if (
                draggedIndex === null ||
                event.pointerId !== pointerId
            ) {

                return;
            }


            event.preventDefault();


            moveDragClone(
                event.clientX,
                event.clientY
            );

        },
        {
            passive: false
        }
    );


    slime.addEventListener(
        "pointerup",
        event => {

            if (
                event.pointerId !== pointerId
            ) {

                return;
            }


            event.preventDefault();


            finishDrag(
                event.clientX,
                event.clientY
            );

        },
        {
            passive: false
        }
    );


    slime.addEventListener(
        "pointercancel",
        event => {

            if (
                event.pointerId !== pointerId
            ) {

                return;
            }


            cancelDrag();

        },
        {
            passive: false
        }
    );
}


/* =========================================================
   CLONE DE DRAG
   ========================================================= */

function createDragClone(
    slime,
    x,
    y
) {

    dragClone =
        slime.cloneNode(true);


    dragClone.style.position =
        "fixed";

    dragClone.style.left =
        x + "px";

    dragClone.style.top =
        y + "px";

    dragClone.style.width =
        slime.getBoundingClientRect().width +
        "px";

    dragClone.style.height =
        slime.getBoundingClientRect().height +
        "px";

    dragClone.style.transform =
        "translate(-50%, -50%) scale(1.12)";

    dragClone.style.pointerEvents =
        "none";

    dragClone.style.zIndex =
        "99999";


    dragClone.classList.remove(
        "dragging"
    );


    document.body.appendChild(
        dragClone
    );
}


/* =========================================================
   DÉPLACER CLONE
   ========================================================= */

function moveDragClone(
    x,
    y
) {

    if (!dragClone) {

        return;
    }


    dragClone.style.left =
        x + "px";

    dragClone.style.top =
        y + "px";
}


/* =========================================================
   FIN DRAG
   ========================================================= */

function finishDrag(
    x,
    y
) {

    const target =
        getDropTarget(
            x,
            y
        );


    if (!target) {

        cancelDrag();

        return;
    }


    const sourceType =
        draggedType;

    const sourceIndex =
        draggedIndex;


    let sourceSlime;


    if (
        sourceType ===
        "board"
    ) {

        sourceSlime =
            slots[sourceIndex];

    } else {

        sourceSlime =
            storageSlots[sourceIndex];

    }


    if (!sourceSlime) {

        cancelDrag();

        return;
    }


    /* ============================================
       VERS LE STOCKAGE
       ============================================ */

    if (
        target.type ===
        "storage"
    ) {

        const targetIndex =
            target.index;


        const targetSlime =
            storageSlots[targetIndex];


        /* Case vide */

        if (!targetSlime) {

            storageSlots[targetIndex] =
                sourceSlime;


            if (
                sourceType ===
                "board"
            ) {

                slots[sourceIndex] =
                    null;

            } else {

                storageSlots[sourceIndex] =
                    null;
            }


            cleanupDrag();

            renderBoard();

            showMessage(
                "Slime stocké !"
            );

            return;
        }


        /* Même niveau = fusion */

        if (
            targetSlime.level ===
            sourceSlime.level
        ) {

            if (
                sourceSlime.level >=
                MAX_LEVEL
            ) {

                showMessage(
                    "Niveau maximum atteint."
                );

                cancelDrag();

                return;
            }


            storageSlots[targetIndex] = {

                level:
                    sourceSlime.level + 1

            };


            if (
                sourceType ===
                "board"
            ) {

                slots[sourceIndex] =
                    null;

            } else {

                storageSlots[sourceIndex] =
                    null;
            }


            cleanupDrag();

            renderBoard();

            showMessage(
                "Fusion !"
            );

            return;
        }


        /* Échange */

        storageSlots[targetIndex] =
            sourceSlime;


        if (
            sourceType ===
            "board"
        ) {

            slots[sourceIndex] =
                targetSlime;

        } else {

            storageSlots[sourceIndex] =
                targetSlime;
        }


        cleanupDrag();

        renderBoard();

        return;
    }


    /* ============================================
       VERS LE PLATEAU
       ============================================ */

    if (
        target.type ===
        "board"
    ) {

        const targetIndex =
            target.index;


        const targetSlime =
            slots[targetIndex];


        /* Case vide */

        if (!targetSlime) {

            slots[targetIndex] =
                sourceSlime;


            if (
                sourceType ===
                "storage"
            ) {

                storageSlots[sourceIndex] =
                    null;

            } else {

                slots[sourceIndex] =
                    null;
            }


            cleanupDrag();

            renderBoard(
                targetIndex,
                "new-animation"
            );

            return;
        }


        /* Même case */

        if (
            sourceType ===
            "board" &&
            sourceIndex ===
            targetIndex
        ) {

            cancelDrag();

            return;
        }


        /* Même niveau = fusion */

        if (
            targetSlime.level ===
            sourceSlime.level
        ) {

            if (
                sourceSlime.level >=
                MAX_LEVEL
            ) {

                showMessage(
                    "Niveau maximum atteint."
                );

                cancelDrag();

                return;
            }


            slots[targetIndex] = {

                level:
                    sourceSlime.level + 1

            };


            if (
                sourceType ===
                "storage"
            ) {

                storageSlots[sourceIndex] =
                    null;

            } else {

                slots[sourceIndex] =
                    null;
            }


            cleanupDrag();

            renderBoard(
                targetIndex,
                "merge-animation"
            );

            showMessage(
                "Fusion !"
            );

            return;
        }


        /* Échange */

        slots[targetIndex] =
            sourceSlime;


        if (
            sourceType ===
            "storage"
        ) {

            storageSlots[sourceIndex] =
                targetSlime;

        } else {

            slots[sourceIndex] =
                targetSlime;
        }


        cleanupDrag();

        renderBoard();
    }
}


/* =========================================================
   TROUVER LA CIBLE
   ========================================================= */

function getDropTarget(
    x,
    y
) {

    const elements =
        document.elementsFromPoint(
            x,
            y
        );


    for (
        const element
        of elements
    ) {

        const boardSlot =
            element.closest(
                ".slot"
            );


        if (
            boardSlot &&
            board.contains(
                boardSlot
            )
        ) {

            return {

                type: "board",

                index:
                    Number(
                        boardSlot.dataset.index
                    )

            };
        }


        const storageSlot =
            element.closest(
                ".storage-slot"
            );


        if (storageSlot) {

            return {

                type: "storage",

                index:
                    Number(
                        storageSlot.dataset.storage
                    )

            };
        }
    }


    return null;
}


/* =========================================================
   ANNULER
   ========================================================= */

function cancelDrag() {

    cleanupDrag();
}


/* =========================================================
   NETTOYAGE
   ========================================================= */

function cleanupDrag() {

    if (draggedElement) {

        draggedElement.classList.remove(
            "dragging"
        );
    }


    if (dragClone) {

        dragClone.remove();

        dragClone =
            null;
    }


    draggedElement =
        null;

    draggedType =
        null;

    draggedIndex =
        null;

    pointerId =
        null;
}


/* =========================================================
   CRÉER SAUVEGARDE
   ========================================================= */

function createSave() {

    const data = {

        version: 2,

        slots:
            slots,

        storageSlots:
            storageSlots,

        savedAt:
            Date.now()

    };


    const json =
        JSON.stringify(data);


    return btoa(
        encodeURIComponent(
            json
        )
    );
}


/* =========================================================
   CHARGER SAUVEGARDE
   ========================================================= */

function loadSave(
    code
) {

    try {

        const json =
            decodeURIComponent(
                atob(code)
            );


        const data =
            JSON.parse(json);


        if (
            !data ||
            !Array.isArray(
                data.slots
            ) ||
            data.slots.length !== 9
        ) {

            return false;
        }


        const loadedStorage =
            Array.isArray(
                data.storageSlots
            )
                ? data.storageSlots
                : [
                    null,
                    null,
                    null
                ];


        if (
            loadedStorage.length !== 3
        ) {

            return false;
        }


        const validSlots =
            data.slots.every(
                slot => {

                    if (
                        slot === null
                    ) {

                        return true;
                    }


                    return (
                        typeof slot ===
                            "object" &&
                        Number.isInteger(
                            slot.level
                        ) &&
                        slot.level >= 1 &&
                        slot.level <=
                            MAX_LEVEL
                    );
                }
            );


        const validStorage =
            loadedStorage.every(
                slot => {

                    if (
                        slot === null
                    ) {

                        return true;
                    }


                    return (
                        typeof slot ===
                            "object" &&
                        Number.isInteger(
                            slot.level
                        ) &&
                        slot.level >= 1 &&
                        slot.level <=
                            MAX_LEVEL
                    );
                }
            );


        if (
            !validSlots ||
            !validStorage
        ) {

            return false;
        }


        slots =
            data.slots.map(
                slot => {

                    if (
                        slot === null
                    ) {

                        return null;
                    }


                    return {

                        level:
                            slot.level

                    };
                }
            );


        storageSlots =
            loadedStorage.map(
                slot => {

                    if (
                        slot === null
                    ) {

                        return null;
                    }


                    return {

                        level:
                            slot.level

                    };
                }
            );


        renderBoard();


        return true;

    } catch {

        return false;
    }
}


/* =========================================================
   COPIER
   ========================================================= */

document
    .getElementById(
        "copyButton"
    )
    .addEventListener(
        "click",
        async () => {

            const code =
                createSave();


            saveArea.value =
                code;


            try {

                await navigator.clipboard.writeText(
                    code
                );


                showMessage(
                    "Sauvegarde copiée !"
                );

            } catch {

                showMessage(
                    "Impossible de copier."
                );
            }
        }
    );


/* =========================================================
   COLLER
   ========================================================= */

document
    .getElementById(
        "pasteButton"
    )
    .addEventListener(
        "click",
        async () => {

            try {

                const text =
                    await navigator.clipboard.readText();


                if (!text) {

                    showMessage(
                        "Presse-papiers vide."
                    );

                    return;
                }


                saveArea.value =
                    text.trim();


                showMessage(
                    "Sauvegarde collée !"
                );

            } catch {

                showMessage(
                    "Impossible de lire le presse-papiers."
                );
            }
        }
    );


/* =========================================================
   CHARGER
   ========================================================= */

document
    .getElementById(
        "importButton"
    )
    .addEventListener(
        "click",
        () => {

            const code =
                saveArea.value.trim();


            if (!code) {

                showMessage(
                    "Aucune sauvegarde."
                );

                return;
            }


            if (
                loadSave(code)
            ) {

                showMessage(
                    "Sauvegarde chargée !"
                );

            } else {

                showMessage(
                    "Sauvegarde invalide."
                );
            }
        }
    );


/* =========================================================
   AUTOSAVE
   ========================================================= */

function autosave() {

    try {

        localStorage.setItem(
            "slimeMergeAutoSave",
            createSave()
        );

    } catch {}
}


function loadAutoSave() {

    try {

        const code =
            localStorage.getItem(
                "slimeMergeAutoSave"
            );


        if (code) {

            loadSave(
                code
            );
        }

    } catch {}
}


setInterval(
    autosave,
    3000
);


/* =========================================================
   EMPÊCHER LE ZOOM
   ========================================================= */

document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


let lastTouchEnd =
    0;


document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();


        if (
            now - lastTouchEnd <=
            300
        ) {

            event.preventDefault();
        }


        lastTouchEnd =
            now;

    },
    {
        passive: false
    }
);


/* =========================================================
   DÉMARRAGE
   ========================================================= */

loadAutoSave();

renderBoard();


</script>
